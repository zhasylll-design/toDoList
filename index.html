<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>toDoList</title>
    <link href="style.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="main">
        <h1>toDoList</h1>
        <div class="input_field">
            <form id="todo">
                <input placeholder="Add a new task" id="add" name="add" required>
                <button type="submit" class="white-button">Add a Project</button>
            </form>
        </div>
        <div class="toDos"></div>
    </div>
</body>
</html>
